services:
  nightdesk:
    build: .
    ports:
      - "43148:8080"
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-tarka-505801}
      GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-false}
      PUBSUB_TOPIC: nightdesk-shifts
      NIGHTDESK_PORT: "8080"
    volumes:
      - nightdesk-data:/app/data

volumes:
  nightdesk-data:
